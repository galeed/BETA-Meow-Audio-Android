name: Build Meow Audio App (Capacitor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Configurar Java JDK 21
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'


      # 4. Aceptar licencias Android
      - name: Aceptar licencias Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. Instalar dependencias de Capacitor
      - name: Instalar dependencias de Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 6. Preparar archivos estáticos e Inicializar Capacitor
      - name: Inicializar Capacitor y Agregar Plataforma Android
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js *.png www/ 3>/dev/null || true
          npx cap init "Meow Audio App" "com.meowaudio.app" --web-dir www
          npx cap add android
          npx cap copy android
          npx cap sync android

      # 7. Corregir conflictos de dependencias en Kotlin
      - name: Resolver conflictos de dependencias de Kotlin
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      dependencySubstitution {
                          substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                          substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                      }
                  }
              }
          }
          EOF

      # 8. Asignar permisos de ejecución a Gradle
      - name: Permisos Gradle
        run: chmod +x android/gradlew

      # 9. Compilar APK Debug
      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Pandroid.builder.sdkDownload=true

      # 10. Subir la APK generada como artefacto
      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: meow-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
